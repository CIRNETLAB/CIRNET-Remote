syntax = "proto3";
// DEPRECATED legacy v1; new instrument consumers use v2 lifecycle.
package netcircuit.hardware.v1;

message InstrumentRequest {
  string station_id = 1;
  string instrument_id = 2;
  string configuration_json = 3;
}

message InstrumentReply {
  bool accepted = 1;
  string code = 2;
  string message = 3;
}

service InstrumentService {
  rpc Configure(InstrumentRequest) returns (InstrumentReply);
}
