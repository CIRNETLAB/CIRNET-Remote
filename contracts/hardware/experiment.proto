syntax = "proto3";
// DEPRECATED: raw graph Run is not a physical safety contract. Use v2 lifecycle.
package netcircuit.hardware.v1;

message ExperimentRequest {
  string station_id = 1;
  string experiment_id = 2;
  string circuit_graph_json = 3;
}

message ExperimentReply {
  bool accepted = 1;
  string code = 2;
  string message = 3;
}

service ExperimentService {
  rpc ApplyCircuit(ExperimentRequest) returns (ExperimentReply);
  rpc Run(ExperimentRequest) returns (ExperimentReply);
  rpc Stop(ExperimentRequest) returns (ExperimentReply);
}
