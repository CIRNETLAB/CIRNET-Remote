[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netcircuit-remote-dev"
version = "0.1.0"
description = "Local integration dependency entrypoint for net*CIRCUIT Remote"
requires-python = ">=3.11"
dependencies = ["netcircuit-contracts==1.0.1", "netcircuit-simulator==0.2.0"]

[tool.setuptools]
packages = []
include-package-data = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
norecursedirs = ["simulator/circuit-simulator", ".*", "build", "dist", "node_modules", "venv"]
