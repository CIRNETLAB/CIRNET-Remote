[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cirnet-remote-dev"
version = "0.1.2"
description = "Local integration dependency entrypoint for CIRNET Remote"
requires-python = ">=3.11"
dependencies = ["cirnet-contracts==0.1.1", "cirnet-simulator==0.1.1", "cirnet-hardware-service==0.1.1"]

[tool.setuptools]
packages = []
include-package-data = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
norecursedirs = ["services/hardware-service", "simulator/circuit-simulator", "tests/fpga", ".*", "build", "dist", "node_modules", "venv"]
