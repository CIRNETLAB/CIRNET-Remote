[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "netcircuit-contracts"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18"]

[tool.setuptools.packages.find]
include = ["contracts*"]
namespaces = false

[tool.setuptools.package-data]
contracts = ["assignment/*.json", "physical-lab/*.json", "physical-lab/examples/*.json", "circuit-schema/*.json", "memory/*.json", "design-models/*.json"]
