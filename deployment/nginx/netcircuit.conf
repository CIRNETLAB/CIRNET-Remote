# Replace the example origin and certificate paths before installing this template.
server {
    listen 80;
    server_name lab.example.invalid;
    return 308 https://lab.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    server_name lab.example.invalid;
    ssl_certificate /etc/letsencrypt/live/lab.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lab.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/netcircuit/web;
    index index.html;
    client_max_body_size 4m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        error_page 413 = @request_budget_error;
        client_body_timeout 10s;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 60s;
    }

    location @request_budget_error {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header X-Request-ID $request_id always;
        return 400 '{"code":"REQUEST_TOO_LARGE","message":"The request exceeds the supported input budget.","request_id":"$request_id"}';
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
