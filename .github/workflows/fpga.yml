name: FPGA source artifact acceptance
env:
  PYTHONDONTWRITEBYTECODE: '1'
on:
  push:
    paths: ['contracts/**', 'tests/contracts/**', 'tests/integration/**', 'integration/**', 'scripts/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/fpga.yml']
  pull_request:
    paths: ['contracts/**', 'tests/contracts/**', 'tests/integration/**', 'integration/**', 'scripts/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/fpga.yml']
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Select exact dependency artifacts from the system lock
        run: python scripts/select_ci_release.py --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Bootstrap the pinned independent DEV allocator
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-verification
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-verification
        shell: bash
        run: |
          CIRNET_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export CIRNET_ARTIFACTS_SESSION
          echo "CIRNET_ARTIFACTS_SESSION=$CIRNET_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          mkdir -p "$ci_runtime/tmp" "$ci_runtime/pip-cache" "$ci_runtime/npm-cache"
          {
            echo "CIRNET_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "CIRNET_CAPTURE_DIR=$ci_runtime/captures"
            echo "TMP=$ci_runtime/tmp"
            echo "TEMP=$ci_runtime/tmp"
            echo "TMPDIR=$ci_runtime/tmp"
            echo "PIP_CACHE_DIR=$ci_runtime/pip-cache"
            echo "npm_config_cache=$ci_runtime/npm-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - env:
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python scripts/install_hardware.py
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Select the exact reviewed FPGA source artifact
        env:
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_fpga.py
      - name: Verify source, logical Contracts and B12 compatibility
        run: python -m scripts.check_fpga_consumer
      - name: Install the source artifact's hash-locked parser and test tools
        shell: bash
        run: |
          wheelhouse="$(node scripts/artifact-paths.mjs fpga-wheelhouse)"
          python -m pip download --require-hashes --only-binary=:all: --dest "$wheelhouse" -r "$CIRNET_FPGA_ROOT/requirements-verification.lock"
          python -m pip install --no-index --require-hashes --find-links "$wheelhouse" -r "$CIRNET_FPGA_ROOT/requirements-verification.lock"
          python -m pip check
      - name: Install the source artifact's pinned native RTL toolchain
        run: python -B "$CIRNET_FPGA_ROOT/scripts/install_toolchain.py"
      - name: Mandatory parser, compiler and safety behavior from the reviewed source
        shell: bash
        run: |
          toolchain_root="${CIRNET_FPGA_TOOLCHAIN_ROOT-${NETCIRCUIT_FPGA_TOOLCHAIN_ROOT-}}"
          if [ -z "$toolchain_root" ]; then
            echo "::error::FPGA toolchain root was not exported by the installer."
            exit 1
          fi
          python -B "$CIRNET_FPGA_ROOT/scripts/check_rtl.py" --toolchain-root "$toolchain_root"
      - name: Installed Hardware remains unavailable under the selected scaffold
        run: python -m pytest -q tests/integration/test_fpga_compatibility.py tests/contracts/test_fpga_proposal_mapping.py --basetemp "$CIRNET_ARTIFACTS_SESSION/pytest"
      - name: Clean the owned external verification session
        if: always() && env.CIRNET_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/cleanup-artifact-session.mjs --cleanup "$CIRNET_ARTIFACTS_SESSION"
