name: FPGA source artifact acceptance
env:
  PYTHONDONTWRITEBYTECODE: '1'
  NETCIRCUIT_FPGA_ARTIFACT_FILENAME: netcircuit-fpga-scaffold-0.1.1.tar.gz
  NETCIRCUIT_FPGA_ARTIFACT_URL: ${{ vars.NETCIRCUIT_FPGA_ARTIFACT_URL }}
  NETCIRCUIT_FPGA_ARTIFACT_SHA256: ${{ vars.NETCIRCUIT_FPGA_ARTIFACT_SHA256 }}
  NETCIRCUIT_HARDWARE_WHEEL_FILENAME: netcircuit_hardware_service-0.1.1-py3-none-any.whl
  NETCIRCUIT_HARDWARE_WHEEL_URL: ${{ vars.NETCIRCUIT_HARDWARE_WHEEL_URL }}
  NETCIRCUIT_HARDWARE_WHEEL_SHA256: ${{ vars.NETCIRCUIT_HARDWARE_WHEEL_SHA256 }}
  NETCIRCUIT_SIMULATOR_WHEEL_FILENAME: netcircuit_simulator-0.1.1-py3-none-any.whl
  NETCIRCUIT_SIMULATOR_WHEEL_URL: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_URL }}
  NETCIRCUIT_SIMULATOR_WHEEL_SHA256: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_WHEEL_FILENAME: netcircuit_contracts-0.1.1-py3-none-any.whl
  NETCIRCUIT_CONTRACTS_NPM_FILENAME: tinihi-labs-contracts-0.1.1.tgz
  NETCIRCUIT_CONTRACTS_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_NPM_URL: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_URL }}
  NETCIRCUIT_CONTRACTS_NPM_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_SHA256 }}
on:
  push:
    paths: ['fpga/**', 'contracts/**', 'device-library/**', 'tests/contracts/**', 'tests/integration/**', 'tests/fpga/**', 'integration/**', 'scripts/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/fpga.yml']
  pull_request:
    paths: ['fpga/**', 'contracts/**', 'device-library/**', 'tests/contracts/**', 'tests/integration/**', 'tests/fpga/**', 'integration/**', 'scripts/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/fpga.yml']
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap the pinned independent DEV allocator
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
        shell: bash
        run: |
          NETCIRCUIT_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export NETCIRCUIT_ARTIFACTS_SESSION
          echo "NETCIRCUIT_ARTIFACTS_SESSION=$NETCIRCUIT_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          mkdir -p "$ci_runtime/tmp" "$ci_runtime/pip-cache" "$ci_runtime/npm-cache"
          {
            echo "NETCIRCUIT_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "NETCIRCUIT_CAPTURE_DIR=$ci_runtime/captures"
            echo "TMP=$ci_runtime/tmp"
            echo "TEMP=$ci_runtime/tmp"
            echo "TMPDIR=$ci_runtime/tmp"
            echo "PIP_CACHE_DIR=$ci_runtime/pip-cache"
            echo "npm_config_cache=$ci_runtime/npm-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python scripts/install_hardware.py
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Select the exact reviewed FPGA source artifact
        env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_fpga.py
      - name: Verify source, logical Contracts and B12 compatibility
        run: python -m scripts.check_fpga_consumer
      - name: Install the source artifact's hash-locked parser and test tools
        shell: bash
        run: |
          wheelhouse="$(node scripts/artifact-paths.mjs fpga-wheelhouse)"
          python -m pip download --require-hashes --only-binary=:all: --dest "$wheelhouse" -r "$NETCIRCUIT_FPGA_ROOT/requirements-verification.lock"
          python -m pip install --no-index --require-hashes --find-links "$wheelhouse" -r "$NETCIRCUIT_FPGA_ROOT/requirements-verification.lock"
          python -m pip check
      - name: Install the source artifact's pinned native RTL toolchain
        run: python -B "$NETCIRCUIT_FPGA_ROOT/scripts/install_toolchain.py"
      - name: Mandatory parser, compiler and safety behavior from the reviewed source
        run: python -B "$NETCIRCUIT_FPGA_ROOT/scripts/check_rtl.py" --toolchain-root "$NETCIRCUIT_FPGA_TOOLCHAIN_ROOT"
      - name: Installed Hardware remains unavailable under the selected scaffold
        run: python -m pytest -q tests/integration/test_fpga_compatibility.py tests/contracts/test_fpga_proposal_mapping.py --basetemp "$NETCIRCUIT_ARTIFACTS_SESSION/pytest"
      - name: Clean the owned external verification session
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/artifact-paths.mjs --cleanup "$NETCIRCUIT_ARTIFACTS_SESSION"
