name: FPGA Scaffold
on:
  push:
    paths: ['fpga/**', 'contracts/fpga-protocol/**', 'tests/fpga/**', 'services/hardware-service/hardware_service/fpga_transport.py', '.github/workflows/fpga.yml']
  pull_request:
    paths: ['fpga/**', 'contracts/fpga-protocol/**', 'tests/fpga/**', 'services/hardware-service/hardware_service/fpga_transport.py', '.github/workflows/fpga.yml']
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pytest jsonschema pyslang
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Syntax check both scaffold domains
        run: iverilog -g2012 -tnull fpga/experiment-controller/rtl/top.v fpga/instrument/rtl/top.v
      - name: Safety and unavailable-instrument behavior
        run: pytest -q tests/fpga
