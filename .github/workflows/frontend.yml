name: Frontend
env:
  PYTHONDONTWRITEBYTECODE: '1'
  NETCIRCUIT_SIMULATOR_WHEEL_FILENAME: netcircuit_simulator-0.1.1-py3-none-any.whl
  NETCIRCUIT_SIMULATOR_WHEEL_URL: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_URL }}
  NETCIRCUIT_SIMULATOR_WHEEL_SHA256: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_WHEEL_FILENAME: netcircuit_contracts-0.1.1-py3-none-any.whl
  NETCIRCUIT_CONTRACTS_NPM_FILENAME: tinihi-labs-contracts-0.1.1.tgz
  NETCIRCUIT_CONTRACTS_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_NPM_URL: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_URL }}
  NETCIRCUIT_CONTRACTS_NPM_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_SHA256 }}
  NETCIRCUIT_CONTRACTS_SDIST_URL: ${{ vars.NETCIRCUIT_CONTRACTS_SDIST_URL }}
  NETCIRCUIT_ARTIFACT_PATHS_NPM_URL: ${{ vars.NETCIRCUIT_ARTIFACT_PATHS_NPM_URL }}
on:
  push:
    paths: ['apps/web/**', 'tests/frontend/**', 'contracts/**', 'device-library/**', 'scripts/**', 'services/api/**', 'simulator/circuit-simulator/**', 'integration/**', 'pyproject.toml', 'requirements-codegen.txt', 'requirements-verification.txt', 'requirements-benchmark.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/**']
  pull_request:
    paths: ['apps/web/**', 'tests/frontend/**', 'contracts/**', 'device-library/**', 'scripts/**', 'services/api/**', 'simulator/circuit-simulator/**', 'integration/**', 'pyproject.toml', 'requirements-codegen.txt', 'requirements-verification.txt', 'requirements-benchmark.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap the pinned independent DEV allocator
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
        shell: bash
        run: |
          NETCIRCUIT_ARTIFACTS_CONTEXT="$(node --input-type=module -e "import {getArtifactContext} from './scripts/artifact-paths.mjs'; console.log(JSON.stringify(getArtifactContext()))")"
          export NETCIRCUIT_ARTIFACTS_CONTEXT
          echo "NETCIRCUIT_ARTIFACTS_CONTEXT=$NETCIRCUIT_ARTIFACTS_CONTEXT" >> "$GITHUB_ENV"
          NETCIRCUIT_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export NETCIRCUIT_ARTIFACTS_SESSION
          echo "NETCIRCUIT_ARTIFACTS_SESSION=$NETCIRCUIT_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          mkdir -p "$ci_runtime/tmp" "$ci_runtime/pip-cache" "$ci_runtime/npm-cache"
          {
            echo "NETCIRCUIT_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "NETCIRCUIT_CAPTURE_DIR=$ci_runtime/captures"
            echo "TMP=$ci_runtime/tmp"
            echo "TEMP=$ci_runtime/tmp"
            echo "TMPDIR=$ci_runtime/tmp"
            echo "PIP_CACHE_DIR=$ci_runtime/pip-cache"
            echo "npm_config_cache=$ci_runtime/npm-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - name: Install local contract consumers and test tools
        env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python -m build --no-isolation --wheel --outdir "$NETCIRCUIT_ARTIFACTS_SESSION/api-dist" ./services/api
          python -m pip install "$NETCIRCUIT_ARTIFACTS_SESSION/api-dist/netcircuit_api-0.1.1-py3-none-any.whl"
          python -m pip check
          python -m scripts.check_simulator_consumer
      - name: Download the explicit reviewed Interface product
        env:
          NETCIRCUIT_INTERFACE_ARTIFACT_URL: ${{ vars.NETCIRCUIT_INTERFACE_ARTIFACT_URL }}
          NETCIRCUIT_INTERFACE_ARTIFACT_SHA256: ${{ vars.NETCIRCUIT_INTERFACE_ARTIFACT_SHA256 }}
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python -m scripts.install_interface --github-env "$GITHUB_ENV"
      - name: Bootstrap Interface artifacts before its clean install
        env:
          NETCIRCUIT_CONTRACTS_ARTIFACT_MANIFEST: ''
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: node "$NETCIRCUIT_INTERFACE_ROOT/scripts/bootstrap-contracts.mjs" --github-env "$GITHUB_ENV"
      - name: Install locked Playwright 1.64.1 and Interface dependencies
        working-directory: ${{ env.NETCIRCUIT_INTERFACE_ROOT }}
        run: npm ci --no-audit --no-fund
      - name: Check pinned artifact projections and route parity
        run: |
          python -m scripts.check_contract_consumer
          python scripts/generate_contracts.py --check
          python scripts/export_openapi.py --check
          python scripts/sync_editor_catalog.py --check
      - name: AST dependency boundaries
        working-directory: ${{ env.NETCIRCUIT_INTERFACE_ROOT }}
        run: npm run check:boundaries
      - name: Typecheck and frontend runtime tests
        working-directory: ${{ env.NETCIRCUIT_INTERFACE_ROOT }}
        run: npm test
      - name: Build workbench and imported GLB previews
        working-directory: ${{ env.NETCIRCUIT_INTERFACE_ROOT }}
        run: npm run build
      - name: Python browser-boundary and workflow tests
        run: python -m pytest -q tests/frontend --basetemp "$NETCIRCUIT_ARTIFACTS_SESSION/pytest"
      - name: Clean the owned external verification session
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/artifact-paths.mjs --cleanup "$NETCIRCUIT_ARTIFACTS_SESSION"
