name: Frontend
on:
  push:
    paths: ['apps/web/**', 'tests/frontend/**', 'contracts/circuit-schema/**', 'contracts/memory/**', 'contracts/physical-lab/**', 'contracts/assignment/**', 'device-library/**', 'scripts/sync_editor_catalog.py', 'scripts/sync_lab_contracts.py', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['apps/web/**', 'tests/frontend/**', 'contracts/circuit-schema/**', 'contracts/memory/**', 'contracts/physical-lab/**', 'contracts/assignment/**', 'device-library/**', 'scripts/sync_editor_catalog.py', 'scripts/sync_lab_contracts.py', '.github/workflows/frontend.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python smoke-test dependency
        run: pip install pytest
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Frontend runtime tests
        working-directory: apps/web
        run: npm test
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: Boundary smoke tests
        run: pytest -q tests/frontend
