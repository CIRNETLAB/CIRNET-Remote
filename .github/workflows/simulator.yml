name: Simulator
on:
  push:
    paths: ['simulator/**', 'device-library/**', '.github/workflows/simulator.yml']
  pull_request:
    paths: ['simulator/**', 'device-library/**', '.github/workflows/simulator.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . -e './simulator/circuit-simulator[test]'
      - run: pytest -q simulator/circuit-simulator/tests
