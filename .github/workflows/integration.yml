name: Integration
env:
  PYTHONDONTWRITEBYTECODE: '1'
  NETCIRCUIT_FPGA_ARTIFACT_FILENAME: netcircuit-fpga-scaffold-0.1.1.tar.gz
  NETCIRCUIT_FPGA_ARTIFACT_URL: ${{ vars.NETCIRCUIT_FPGA_ARTIFACT_URL }}
  NETCIRCUIT_FPGA_ARTIFACT_SHA256: ${{ vars.NETCIRCUIT_FPGA_ARTIFACT_SHA256 }}
  NETCIRCUIT_HARDWARE_WHEEL_FILENAME: netcircuit_hardware_service-0.1.1-py3-none-any.whl
  NETCIRCUIT_HARDWARE_WHEEL_URL: ${{ vars.NETCIRCUIT_HARDWARE_WHEEL_URL }}
  NETCIRCUIT_HARDWARE_WHEEL_SHA256: ${{ vars.NETCIRCUIT_HARDWARE_WHEEL_SHA256 }}
  NETCIRCUIT_SIMULATOR_WHEEL_FILENAME: netcircuit_simulator-0.1.1-py3-none-any.whl
  NETCIRCUIT_SIMULATOR_WHEEL_URL: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_URL }}
  NETCIRCUIT_SIMULATOR_WHEEL_SHA256: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_WHEEL_FILENAME: netcircuit_contracts-0.1.1-py3-none-any.whl
  NETCIRCUIT_CONTRACTS_NPM_FILENAME: tinihi-labs-contracts-0.1.1.tgz
  NETCIRCUIT_CONTRACTS_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_NPM_URL: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_URL }}
  NETCIRCUIT_CONTRACTS_SDIST_URL: ${{ vars.NETCIRCUIT_CONTRACTS_SDIST_URL }}
  NETCIRCUIT_ARTIFACT_PATHS_NPM_URL: ${{ vars.NETCIRCUIT_ARTIFACT_PATHS_NPM_URL }}
  NETCIRCUIT_CONTRACTS_NPM_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_SHA256 }}
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  system-artifact-access:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require the selected private-artifact credential
        shell: bash
        run: ': "${NETCIRCUIT_ARTIFACTS_TOKEN:?NETCIRCUIT_ARTIFACTS_READ_TOKEN is required}"'
      - name: Select exact dependency artifacts from the system lock
        run: python scripts/select_ci_release.py --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Bootstrap the pinned independent DEV allocator
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
        shell: bash
        run: |
          NETCIRCUIT_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export NETCIRCUIT_ARTIFACTS_SESSION
          echo "NETCIRCUIT_ARTIFACTS_SESSION=$NETCIRCUIT_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          mkdir -p "$ci_runtime/tmp" "$ci_runtime/pip-cache" "$ci_runtime/npm-cache"
          {
            echo "NETCIRCUIT_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "NETCIRCUIT_CAPTURE_DIR=$ci_runtime/captures"
            echo "TMP=$ci_runtime/tmp"
            echo "TEMP=$ci_runtime/tmp"
            echo "TMPDIR=$ci_runtime/tmp"
            echo "PIP_CACHE_DIR=$ci_runtime/pip-cache"
            echo "npm_config_cache=$ci_runtime/npm-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - name: Install every locked private asset into a fresh owned virtualenv
        shell: bash
        run: |
          set -euo pipefail
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          access_output="$(node scripts/artifact-paths.mjs system-artifact-access)"
          python -m venv "$ci_runtime/access-venv"
          "$ci_runtime/access-venv/bin/python" scripts/install_release.py --manifest integration/release-set.json --environment-file ci-release-env.json 2>&1 | tee "$access_output/installer.log"
          "$ci_runtime/access-venv/bin/python" -I -m pip check 2>&1 | tee -a "$access_output/installer.log"
      - name: Rehash the installed release and write a sanitized receipt
        shell: bash
        run: |
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          "$ci_runtime/access-venv/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          from scripts.artifact_paths import artifact_directory, validate_artifact_directory
          from scripts.check_release_rollback import load_environment
          from scripts.install_release import verify_rollback_bundle
          from scripts.system_release_manifest import load_manifest, validate_manifest

          PACKAGES = (
              ('netcircuit-api', 'app', '0.1.1', 'Remote', 'python'),
              ('netcircuit-contracts', 'contracts', '0.1.1', 'Contracts', 'python'),
              ('netcircuit-simulator', 'netcircuit_sim', '0.1.1', 'Simulator', 'python'),
              ('netcircuit-hardware-service', 'hardware_service', '0.1.1', 'Hardware', 'python'),
              ('netcircuit-artifact-paths', 'netcircuit_artifact_paths', '1.0.0a1', 'Contracts', 'dev'),
          )
          ORIGIN_PROBE = r'''
          import importlib
          from importlib.metadata import distribution
          import json
          from pathlib import Path
          import sys
          import sysconfig
          sys.dont_write_bytecode = True
          assert sys.flags.isolated, 'Package origins require Python isolated mode'
          roots = {Path(sysconfig.get_paths()[key]).resolve() for key in ('purelib', 'platlib')}
          result = []
          for selected in json.loads(sys.argv[1]):
              product = distribution(selected['name'])
              assert product.version == selected['version'], 'Installed product version differs'
              direct = json.loads(product.read_text('direct_url.json') or '{}')
              assert 'dir_info' not in direct, 'Editable/source installations are forbidden'
              archive = direct.get('archive_info', {})
              digest = archive.get('hashes', {}).get('sha256')
              if digest is None and archive.get('hash', '').startswith('sha256='):
                  digest = archive['hash'].split('=', 1)[1]
              assert digest == selected['sha256'], 'Installed wheel digest differs'
              module = importlib.import_module(selected['module'])
              origin = Path(module.__file__).resolve()
              expected = Path(product.locate_file(selected['module'] + '/__init__.py')).resolve()
              assert origin == expected and any(origin.is_relative_to(root) for root in roots), 'Import is shadowed by source'
              result.append({'name': selected['name'], 'version': product.version,
                             'origin': str(origin), 'selectedSha256': digest})
          print(json.dumps(result))
          '''

          def create_receipt(state, manifest, installed, *, authenticated_request):
              validate_manifest(manifest)
              if authenticated_request is not True:
                  raise ValueError('The named artifact credential must be supplied to the real installer.')
              products = manifest['repositories']
              if set(state['artifacts']) != set(products):
                  raise ValueError('Installed state must identify exactly all six owners.')

              def checked(component, kind, selected, filename):
                  path = Path(filename)
                  validate_artifact_directory(path.parent)
                  if path.name != selected['filename'] or not path.is_file():
                      raise ValueError('Missing selected regular artifact file.')
                  payload = path.read_bytes()
                  digest = hashlib.sha256(payload).hexdigest()
                  if digest != selected['sha256']:
                      raise ValueError('Actual installed-state artifact bytes differ from the lock.')
                  return {'component': component, 'kind': kind, 'url': selected['url'],
                          'sha256': digest, 'bytes': len(payload), 'apiAuthorizationSupplied': True,
                          'status': 'PASS'}

              rows = []
              for component, product in products.items():
                  if set(state['artifacts'][component]) != set(product['artifacts']):
                      raise ValueError('Installed state has missing or extra artifact kinds.')
                  for kind, selected in product['artifacts'].items():
                      rows.append(checked(component, kind, selected, state['artifacts'][component][kind]))
              if len(rows) != 15:
                  raise ValueError('The credential receipt requires all fifteen current artifacts.')
              rollback = checked('Remote', 'rollback', manifest['rollback']['source'], state['rollback']['archive'])
              preserved = verify_rollback_bundle(state['rollback']['archive'], manifest)
              if preserved != state['rollback']['verifiedPreservedArtifacts']:
                  raise ValueError('Rollback verification count differs from the installed state.')
              rollback['verifiedPreservedArtifacts'] = preserved
              expected = {name: (version, products[component]['artifacts'][kind]['sha256'])
                          for name, module, version, component, kind in PACKAGES}
              if len(installed) != len(expected) or {row['name'] for row in installed} != set(expected):
                  raise ValueError('All installed Python product/tool origins are required.')
              for row in installed:
                  if (row['version'], row['selectedSha256']) != expected[row['name']]:
                      raise ValueError('Installed origin identity differs from the selected wheel.')
              return {'schemaVersion': 1, 'status': 'PASS', 'releaseVersion': manifest['releaseVersion'],
                      'credentialSource': 'NETCIRCUIT_ARTIFACTS_READ_TOKEN',
                      'credentialScopeVerification': 'NOT_VERIFIED',
                      'scopeLimitation': 'Successful downloads do not establish read-only or minimum credential permissions.',
                      'selectedRepositories': {name: {key: product[key] for key in ('repository', 'version', 'sourceRevision')}
                                               for name, product in products.items()},
                      'artifacts': rows, 'rollback': rollback, 'installedPython': installed,
                      'pipCheck': 'PASS', 'rollbackRehearsal': 'NOT_RUN'}

          def main():
              if not os.environ.get('NETCIRCUIT_ARTIFACTS_TOKEN'):
                  raise ValueError('The named private-artifact credential is required.')
              state = load_environment(Path(os.environ['NETCIRCUIT_ARTIFACTS_SESSION']) / 'ci-release-env.json')
              manifest = load_manifest(state['manifest'])
              if manifest != load_manifest('integration/release-set.json'):
                  raise ValueError('Installed snapshot differs from the checked-out system release lock.')
              os.environ.update(state['environment'])
              os.environ.update(state['processEnvironment'])
              selected = [{'name': name, 'module': module, 'version': version,
                           'sha256': manifest['repositories'][component]['artifacts'][kind]['sha256']}
                          for name, module, version, component, kind in PACKAGES]
              probe = subprocess.run([sys.executable, '-I', '-B', '-c', ORIGIN_PROBE, json.dumps(selected)],
                                     cwd=artifact_directory('ci-runtime'), check=True, capture_output=True, text=True)
              receipt = create_receipt(state, manifest, json.loads(probe.stdout), authenticated_request=True)
              receipt['consumer'] = {'repository': os.environ['GITHUB_REPOSITORY'],
                                     'sourceRevision': os.environ['GITHUB_SHA'], 'runId': os.environ['GITHUB_RUN_ID'],
                                     'job': 'system-artifact-access'}
              receipt['installedManifestSha256'] = state['manifestSha256']
              output = artifact_directory('system-artifact-access') / 'receipt.json'
              output.write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
              print('Verified all 15 selected artifacts, preserved rollback bytes, pip check and isolated installed origins.')

          if __name__ == '__main__':
              main()
          PY
      - name: Upload only the sanitized access receipt and actual installer log
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        uses: actions/upload-artifact@v4
        with:
          name: system-artifact-access-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/system-artifact-access/receipt.json
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/system-artifact-access/installer.log
          if-no-files-found: error
          retention-days: 7
      - name: Clean the owned external verification session
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/cleanup-artifact-session.mjs --cleanup "$NETCIRCUIT_ARTIFACTS_SESSION"
  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select exact dependency artifacts from the system lock
        run: python scripts/select_ci_release.py --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Bootstrap the pinned independent DEV allocator
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
        shell: bash
        run: |
          NETCIRCUIT_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export NETCIRCUIT_ARTIFACTS_SESSION
          echo "NETCIRCUIT_ARTIFACTS_SESSION=$NETCIRCUIT_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          mkdir -p "$ci_runtime/tmp" "$ci_runtime/pip-cache" "$ci_runtime/npm-cache"
          {
            echo "NETCIRCUIT_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "NETCIRCUIT_CAPTURE_DIR=$ci_runtime/captures"
            echo "TMP=$ci_runtime/tmp"
            echo "TEMP=$ci_runtime/tmp"
            echo "TMPDIR=$ci_runtime/tmp"
            echo "PIP_CACHE_DIR=$ci_runtime/pip-cache"
            echo "npm_config_cache=$ci_runtime/npm-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python scripts/install_hardware.py
          python -m build --no-isolation --wheel --outdir "$NETCIRCUIT_ARTIFACTS_SESSION/api-dist" ./services/api
          python -m pip install "$NETCIRCUIT_ARTIFACTS_SESSION/api-dist/netcircuit_api-0.1.1-py3-none-any.whl"
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Download the explicit reviewed Interface product
        env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python -m scripts.install_interface --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Bootstrap Interface SDK from exact reviewed artifacts
        env:
          NETCIRCUIT_CONTRACTS_ARTIFACT_MANIFEST: ''
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: node "$NETCIRCUIT_INTERFACE_ROOT/scripts/bootstrap-contracts.mjs" --github-env "$GITHUB_ENV"
      - name: Install independent Interface verification tools
        working-directory: ${{ env.NETCIRCUIT_INTERFACE_ROOT }}
        run: npm ci --no-audit --no-fund
      - name: Verify installed Contracts RPC provenance
        run: python -m scripts.check_contract_consumer
      - name: Select and verify the exact reviewed FPGA source artifact
        env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python scripts/install_fpga.py
      - run: python -m scripts.check_fpga_consumer
      - run: python scripts/check_release.py --group python
      - name: Clean the owned external verification session
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/cleanup-artifact-session.mjs --cleanup "$NETCIRCUIT_ARTIFACTS_SESSION"
  postgresql-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: netcircuit_test
          POSTGRES_DB: netcircuit_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U netcircuit_test -d netcircuit_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NETCIRCUIT_TEST_POSTGRES_URL: postgresql+psycopg://netcircuit_test@127.0.0.1:5432/netcircuit_ci
      NETCIRCUIT_TEST_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Select exact dependency artifacts from the system lock
        run: python scripts/select_ci_release.py --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Bootstrap the pinned independent DEV allocator
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
        shell: bash
        run: |
          NETCIRCUIT_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export NETCIRCUIT_ARTIFACTS_SESSION
          echo "NETCIRCUIT_ARTIFACTS_SESSION=$NETCIRCUIT_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          mkdir -p "$ci_runtime/tmp" "$ci_runtime/pip-cache" "$ci_runtime/npm-cache"
          {
            echo "NETCIRCUIT_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "NETCIRCUIT_CAPTURE_DIR=$ci_runtime/captures"
            echo "TMP=$ci_runtime/tmp"
            echo "TEMP=$ci_runtime/tmp"
            echo "TMPDIR=$ci_runtime/tmp"
            echo "PIP_CACHE_DIR=$ci_runtime/pip-cache"
            echo "npm_config_cache=$ci_runtime/npm-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - name: Install matching PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
      - env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python scripts/install_hardware.py
          python -m build --no-isolation --wheel --outdir "$NETCIRCUIT_ARTIFACTS_SESSION/api-dist" ./services/api
          python -m pip install "$NETCIRCUIT_ARTIFACTS_SESSION/api-dist/netcircuit_api-0.1.1-py3-none-any.whl"
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Actual migrations, backup/restore and independent writer races
        run: python -m pytest -q services/api/tests/postgres_cases.py --basetemp "$NETCIRCUIT_ARTIFACTS_SESSION/pytest"
      - name: Clean the owned external verification session
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/cleanup-artifact-session.mjs --cleanup "$NETCIRCUIT_ARTIFACTS_SESSION"
