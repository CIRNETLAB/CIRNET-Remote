name: Backend
on:
  push:
    paths: ['services/api/**', 'contracts/circuit-schema/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['services/api/**', 'contracts/circuit-schema/**', '.github/workflows/backend.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . -e './services/api[test]'
      - run: pytest -q services/api/tests
