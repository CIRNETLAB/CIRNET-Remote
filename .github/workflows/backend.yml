name: Backend
on:
  push:
    paths: ['services/api/**', 'simulator/**', 'contracts/**', 'device-library/**', 'scripts/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/backend.yml']
  pull_request:
    paths: ['services/api/**', 'simulator/**', 'contracts/**', 'device-library/**', 'scripts/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/backend.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-verification.txt -e . -e './simulator/circuit-simulator[test]' -e './services/api[test]'
      - run: python scripts/generate_hardware_rpc.py
      - run: python -m pytest -q services/api/tests
