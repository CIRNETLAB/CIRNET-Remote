name: Documentation Context
env:
  PYTHONDONTWRITEBYTECODE: '1'
on:
  push:
    branches: [master]
  pull_request:
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Select exact dependency artifacts from the system lock
        run: python scripts/select_ci_release.py --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Bootstrap the pinned independent DEV allocator
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-verification
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-verification
        shell: bash
        run: |
          CIRNET_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export CIRNET_ARTIFACTS_SESSION
          echo "CIRNET_ARTIFACTS_SESSION=$CIRNET_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          mkdir -p "$ci_runtime/tmp" "$ci_runtime/pip-cache" "$ci_runtime/npm-cache"
          {
            echo "CIRNET_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "CIRNET_CAPTURE_DIR=$ci_runtime/captures"
            echo "TMP=$ci_runtime/tmp"
            echo "TEMP=$ci_runtime/tmp"
            echo "TMPDIR=$ci_runtime/tmp"
            echo "PIP_CACHE_DIR=$ci_runtime/pip-cache"
            echo "npm_config_cache=$ci_runtime/npm-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - name: Validate workflow syntax and GitHub expression contexts
        shell: bash
        run: |
          lint_runtime="$(node scripts/artifact-paths.mjs workflow-lint)"
          curl --fail --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$lint_runtime/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$lint_runtime/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$lint_runtime/actionlint.tar.gz" -C "$lint_runtime" actionlint
          "$lint_runtime/actionlint" -shellcheck= -pyflakes= .github/workflows/*.yml
      - run: python scripts/check_context.py
      - run: python scripts/check_markdown.py
      - name: Reject new or modified verification artifacts (including index)
        env:
          ARTIFACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$ARTIFACT_BASE" || "$ARTIFACT_BASE" =~ ^0+$ ]]; then
            ARTIFACT_BASE=$(git hash-object -t tree --stdin </dev/null)
          fi
          node scripts/check-verification-artifacts.mjs --base "$ARTIFACT_BASE"
      - run: node --test scripts/artifact-paths.test.mjs scripts/check-verification-artifacts.test.mjs
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest -q tests/test_docs_baseline.py tests/test_post_r7_provenance.py tests/integration/test_context_integrity.py tests/test_markdown_links.py tests/test_docs_workflow.py --basetemp "$CIRNET_ARTIFACTS_SESSION/pytest"
      - name: Clean the owned external verification session
        if: always() && env.CIRNET_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/cleanup-artifact-session.mjs --cleanup "$CIRNET_ARTIFACTS_SESSION"
