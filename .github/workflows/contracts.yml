name: Contracts
env:
  NETCIRCUIT_HARDWARE_WHEEL_FILENAME: netcircuit_hardware_service-0.1.1-py3-none-any.whl
  NETCIRCUIT_HARDWARE_WHEEL_URL: ${{ vars.NETCIRCUIT_HARDWARE_WHEEL_URL }}
  NETCIRCUIT_HARDWARE_WHEEL_SHA256: ${{ vars.NETCIRCUIT_HARDWARE_WHEEL_SHA256 }}
  NETCIRCUIT_SIMULATOR_WHEEL_FILENAME: netcircuit_simulator-0.2.0-py3-none-any.whl
  NETCIRCUIT_SIMULATOR_WHEEL_URL: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_URL }}
  NETCIRCUIT_SIMULATOR_WHEEL_SHA256: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_WHEEL_FILENAME: netcircuit_contracts-1.0.1-py3-none-any.whl
  NETCIRCUIT_CONTRACTS_NPM_FILENAME: tinihi-labs-contracts-1.0.1.tgz
  NETCIRCUIT_CONTRACTS_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_NPM_URL: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_URL }}
  NETCIRCUIT_CONTRACTS_NPM_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_SHA256 }}
on:
  push:
    paths: ['contracts/**', 'device-library/**', 'scripts/**', 'tests/contracts/**', 'tests/frontend/**', 'services/**', 'simulator/**', 'apps/web/**', 'integration/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/**']
  pull_request:
    paths: ['contracts/**', 'device-library/**', 'scripts/**', 'tests/contracts/**', 'tests/frontend/**', 'services/**', 'simulator/**', 'apps/web/**', 'integration/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/**']
jobs:
  canonical-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Bootstrap the pinned independent DEV allocator
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
        shell: bash
        run: |
          NETCIRCUIT_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export NETCIRCUIT_ARTIFACTS_SESSION
          echo "NETCIRCUIT_ARTIFACTS_SESSION=$NETCIRCUIT_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          {
            echo "NETCIRCUIT_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "NETCIRCUIT_CAPTURE_DIR=$ci_runtime/captures"
          } >> "$GITHUB_ENV"
      - env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python scripts/install_hardware.py
          python -m pip install -e './services/api[test]'
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Install frozen M1 Web reference tooling for retained compatibility checks
        run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: python -m scripts.check_contract_consumer
      - name: Offline schemas, deterministic generation, compatibility and Python conformance
        run: python scripts/check_release.py --group contracts
      - name: Retained M1 Web reference numeric and semantic compatibility checks
        run: npm test
        working-directory: apps/web
      - name: Clean the owned external verification session
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/artifact-paths.mjs --cleanup "$NETCIRCUIT_ARTIFACTS_SESSION"
  installed-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bootstrap the pinned independent DEV allocator
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate external diagnostics session
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-package-check
        run: echo "NETCIRCUIT_ARTIFACTS_SESSION=$(node scripts/artifact-paths.mjs)" >> "$GITHUB_ENV"
      - env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python scripts/install_hardware.py
          python -m pip install -e './services/api[test]'
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Minimum Python runtime; actual wheels installed outside checkout
        run: python scripts/check_contract_package.py
      - name: Preserve installed-package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-package-diagnostics
          path: ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/package-check/*.log
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Clean this job's owned diagnostics
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        run: node scripts/artifact-paths.mjs --cleanup "$NETCIRCUIT_ARTIFACTS_SESSION"
