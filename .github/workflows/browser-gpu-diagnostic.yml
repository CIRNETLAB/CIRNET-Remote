name: DIAGNOSTIC ONLY - Chromium software compositor comparison
on:
  push:
    branches: ['codex/m6-remote-integration']
    paths: ['.github/workflows/browser-gpu-diagnostic.yml', 'scripts/diagnostic-gpu-preload.cjs']
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  NETCIRCUIT_HARDWARE_WHEEL_FILENAME: netcircuit_hardware_service-0.1.1-py3-none-any.whl
  NETCIRCUIT_HARDWARE_WHEEL_URL: ${{ vars.NETCIRCUIT_HARDWARE_WHEEL_URL }}
  NETCIRCUIT_HARDWARE_WHEEL_SHA256: ${{ vars.NETCIRCUIT_HARDWARE_WHEEL_SHA256 }}
  NETCIRCUIT_SIMULATOR_WHEEL_FILENAME: netcircuit_simulator-0.1.1-py3-none-any.whl
  NETCIRCUIT_SIMULATOR_WHEEL_URL: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_URL }}
  NETCIRCUIT_SIMULATOR_WHEEL_SHA256: ${{ vars.NETCIRCUIT_SIMULATOR_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_DEV_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_WHEEL_FILENAME: netcircuit_contracts-0.1.1-py3-none-any.whl
  NETCIRCUIT_CONTRACTS_NPM_FILENAME: tinihi-labs-contracts-0.1.1.tgz
  NETCIRCUIT_CONTRACTS_WHEEL_URL: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_URL }}
  NETCIRCUIT_CONTRACTS_WHEEL_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_WHEEL_SHA256 }}
  NETCIRCUIT_CONTRACTS_NPM_URL: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_URL }}
  NETCIRCUIT_CONTRACTS_NPM_SHA256: ${{ vars.NETCIRCUIT_CONTRACTS_NPM_SHA256 }}
  NETCIRCUIT_CONTRACTS_SDIST_URL: ${{ vars.NETCIRCUIT_CONTRACTS_SDIST_URL }}
  NETCIRCUIT_ARTIFACT_PATHS_NPM_URL: ${{ vars.NETCIRCUIT_ARTIFACT_PATHS_NPM_URL }}
jobs:
  diagnostic:
    name: DIAGNOSTIC ${{ matrix.mode }} - not mandatory acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [A, B, C]
    concurrency:
      group: browser-gpu-diagnostic-${{ github.ref }}-${{ matrix.mode }}
      cancel-in-progress: false
    env:
      NETCIRCUIT_E2E_PYTHON: python
      NETCIRCUIT_GPU_DIAGNOSTIC_MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap the pinned independent DEV allocator
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-verification
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external diagnostic state
        env:
          NETCIRCUIT_ARTIFACTS_DIR: ${{ runner.temp }}/netcircuit-gpu-diagnostic/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}
        shell: bash
        run: |
          NETCIRCUIT_ARTIFACTS_CONTEXT="$(node --input-type=module -e "import {getArtifactContext} from './scripts/artifact-paths.mjs'; console.log(JSON.stringify(getArtifactContext()))")"
          export NETCIRCUIT_ARTIFACTS_CONTEXT
          artifact_session="$(node scripts/artifact-paths.mjs)"
          export NETCIRCUIT_ARTIFACTS_SESSION="$artifact_session"
          runtime="$(node scripts/artifact-paths.mjs diagnostic-runtime)"
          mkdir -p "$runtime/tmp" "$runtime/pip-cache" "$runtime/npm-cache"
          {
            echo "NETCIRCUIT_ARTIFACTS_CONTEXT=$NETCIRCUIT_ARTIFACTS_CONTEXT"
            echo "NETCIRCUIT_ARTIFACTS_SESSION=$artifact_session"
            echo "NETCIRCUIT_DATABASE_URL=sqlite:///$runtime/default.sqlite"
            echo "NETCIRCUIT_CAPTURE_DIR=$runtime/captures"
            echo "TMP=$runtime/tmp"
            echo "TEMP=$runtime/tmp"
            echo "TMPDIR=$runtime/tmp"
            echo "PIP_CACHE_DIR=$runtime/pip-cache"
            echo "npm_config_cache=$runtime/npm-cache"
          } >> "$GITHUB_ENV"
      - name: Install real services using the normal reviewed selections
        env:
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python scripts/install_hardware.py
          python -m build --no-isolation --wheel --outdir "$NETCIRCUIT_ARTIFACTS_SESSION/api-dist" ./services/api
          python -m pip install "$NETCIRCUIT_ARTIFACTS_SESSION/api-dist/netcircuit_api-0.1.1-py3-none-any.whl"
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Download the same reviewed Interface artifact
        env:
          NETCIRCUIT_INTERFACE_ARTIFACT_URL: ${{ vars.NETCIRCUIT_INTERFACE_ARTIFACT_URL }}
          NETCIRCUIT_INTERFACE_ARTIFACT_SHA256: ${{ vars.NETCIRCUIT_INTERFACE_ARTIFACT_SHA256 }}
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python -m scripts.install_interface --github-env "$GITHUB_ENV"
      - name: Bootstrap the unchanged Interface SDK selections
        env:
          NETCIRCUIT_CONTRACTS_ARTIFACT_MANIFEST: ''
          NETCIRCUIT_ARTIFACTS_TOKEN: ${{ secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: node "$NETCIRCUIT_INTERFACE_ROOT/scripts/bootstrap-contracts.mjs" --github-env "$GITHUB_ENV"
      - name: Install the pinned Interface and Playwright dependencies
        working-directory: ${{ env.NETCIRCUIT_INTERFACE_ROOT }}
        run: npm ci --no-audit --no-fund
      - name: Verify normal artifact projections and build inputs
        run: |
          python -m scripts.check_contract_consumer
          python scripts/generate_contracts.py --check
          python scripts/export_openapi.py --check
          python scripts/sync_editor_catalog.py --check
      - name: Typecheck and build the unchanged Interface
        working-directory: ${{ env.NETCIRCUIT_INTERFACE_ROOT }}
        run: |
          npm run check:boundaries
          npx tsc --noEmit -p tsconfig.e2e.json
          npm run build
      - name: Install the identical pinned Chromium and Linux dependencies
        working-directory: ${{ env.NETCIRCUIT_INTERFACE_ROOT }}
        run: npm run test:e2e:install -- --with-deps
      - name: DIAGNOSTIC ONLY - unchanged gallery and DPR assertions
        shell: bash
        run: |
          set -o pipefail
          node scripts/diagnostic-gpu-preload.cjs --self-check
          export NODE_OPTIONS="--require=$GITHUB_WORKSPACE/scripts/diagnostic-gpu-preload.cjs"
          set +e
          node scripts/e2e-interface.mjs e2e/contacts-wires-gallery.spec.ts e2e/depth-artifacts.spec.ts \
            --grep 'contact and continuous-wire gallery|native display face closeups|native WebGL hidden-layer regression DPR [12]$' \
            --workers=1 --retries=0 --forbid-only --reporter=line,junit \
            2>&1 | tee "$NETCIRCUIT_ARTIFACTS_SESSION/e2e.log"
          test_status=${PIPESTATUS[0]}
          set -e
          unset NODE_OPTIONS
          node scripts/diagnostic-gpu-preload.cjs --verify "$NETCIRCUIT_GPU_DIAGNOSTIC_MODE"
          exit "$test_status"
      - name: Upload diagnostic evidence even when an arm fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-diagnostic-${{ matrix.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/gpu-diagnostic
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/browser-logs
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/br-*/**/debug.log
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/br-*/**/chrome_debug.log
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/playwright
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/playwright-reporters
            ${{ env.NETCIRCUIT_ARTIFACTS_SESSION }}/e2e.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Clean only this owned diagnostic session after upload
        if: always() && env.NETCIRCUIT_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/artifact-paths.mjs --cleanup "$NETCIRCUIT_ARTIFACTS_SESSION"
