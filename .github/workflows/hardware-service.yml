name: Hardware Service
on:
  push:
    paths: ['services/hardware-service/**', 'contracts/hardware/**', '.github/workflows/hardware-service.yml']
  pull_request:
    paths: ['services/hardware-service/**', 'contracts/hardware/**', '.github/workflows/hardware-service.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . -e './services/hardware-service[dev]'
      - run: pytest -q services/hardware-service/tests
