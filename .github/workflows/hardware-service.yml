name: Hardware and Simulator artifact consumers
env:
  PYTHONDONTWRITEBYTECODE: '1'
on:
  push:
    branches: [master]
    paths: ['tests/integration/**', 'tests/contracts/**', 'tests/support/**', 'services/api/**', 'contracts/**', 'scripts/**', 'integration/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/hardware-service.yml']
  pull_request:
    paths: ['tests/integration/**', 'tests/contracts/**', 'tests/support/**', 'services/api/**', 'contracts/**', 'scripts/**', 'integration/**', 'pyproject.toml', 'requirements-*.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/hardware-service.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Select exact dependency artifacts from the system lock
        run: python scripts/select_ci_release.py --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Bootstrap the pinned independent DEV allocator
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-verification
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate owned external verification runtime
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-verification
        shell: bash
        run: |
          CIRNET_ARTIFACTS_SESSION="$(node scripts/artifact-paths.mjs)"
          export CIRNET_ARTIFACTS_SESSION
          echo "CIRNET_ARTIFACTS_SESSION=$CIRNET_ARTIFACTS_SESSION" >> "$GITHUB_ENV"
          ci_runtime="$(node scripts/artifact-paths.mjs ci-runtime)"
          mkdir -p "$ci_runtime/tmp" "$ci_runtime/pip-cache"
          {
            echo "CIRNET_DATABASE_URL=sqlite:///$ci_runtime/default.sqlite"
            echo "CIRNET_CAPTURE_DIR=$ci_runtime/captures"
            echo "TMP=$ci_runtime/tmp"
            echo "TEMP=$ci_runtime/tmp"
            echo "TMPDIR=$ci_runtime/tmp"
            echo "PIP_CACHE_DIR=$ci_runtime/pip-cache"
            echo "PYTHONDONTWRITEBYTECODE=1"
          } >> "$GITHUB_ENV"
      - name: Build Python dependencies from pinned source
        run: |
          python -B scripts/build_ci_dependency.py Contracts --github-env "$GITHUB_ENV"
          python -B scripts/build_ci_dependency.py Simulator --github-env "$GITHUB_ENV"
          python -B scripts/build_ci_dependency.py Hardware --github-env "$GITHUB_ENV"
      - env:
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py --manifest "$CIRNET_CI_CONTRACTS_ARTIFACT_MANIFEST"
          python scripts/install_simulator.py --wheel "$CIRNET_CI_SIMULATOR_WHEEL" --sha256 "$CIRNET_CI_SIMULATOR_WHEEL_SHA256"
          python scripts/install_hardware.py --wheel "$CIRNET_CI_HARDWARE_WHEEL" --sha256 "$CIRNET_CI_HARDWARE_WHEEL_SHA256"
          python -m build --no-isolation --wheel --outdir "$CIRNET_ARTIFACTS_SESSION/api-dist" ./services/api
          python -m pip install "$CIRNET_ARTIFACTS_SESSION/api-dist/cirnet_api-0.1.2-py3-none-any.whl"
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Extract verified Interface source for the default collection guard
        env:
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python -m scripts.install_interface --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Verify installed Contracts RPC provenance
        run: python -m scripts.check_contract_consumer
      - name: Verify both installed artifact consumers
        run: >-
          python -m pytest -q
          tests/contracts/test_hardware_artifact.py
          tests/contracts/test_hardware_installer.py
          tests/integration/test_capture_rpc_data_plane.py
          tests/integration/test_instrument_path_rpc.py
          tests/integration/test_virtual_lab_execution.py
          tests/integration/test_simulation_backend_selection.py
          tests/contracts/test_simulator_artifact.py
          services/api/tests/test_physical_preview.py
          --basetemp "$CIRNET_ARTIFACTS_SESSION/pytest"
      - name: Clean the owned external verification session
        if: always() && env.CIRNET_ARTIFACTS_SESSION != ''
        shell: bash
        run: node scripts/cleanup-artifact-session.mjs --cleanup "$CIRNET_ARTIFACTS_SESSION"
