name: Real browser release gate
env:
  PYTHONDONTWRITEBYTECODE: '1'
on:
  push:
    branches: [master]
    tags: ['v*']
    paths: ['tests/frontend/**', 'tests/integration/**', 'tests/support/**', 'contracts/**', 'scripts/**', 'services/api/**', 'integration/**', 'pyproject.toml', 'requirements-verification.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/**']
  pull_request:
    paths: ['tests/frontend/**', 'tests/integration/**', 'tests/support/**', 'contracts/**', 'scripts/**', 'services/api/**', 'integration/**', 'pyproject.toml', 'requirements-verification.txt', 'setup.py', 'MANIFEST.in', 'Makefile', '.gitattributes', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      interface_source:
        description: Interface source to verify
        type: choice
        options: [published, candidate]
        default: published
permissions:
  contents: read
concurrency:
  group: real-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # Preserve the original job envelope and per-test budgets across approved runners.
    timeout-minutes: 90
    env:
      # The harness owns a real SQLite database, API and virtual Hardware Service.
      # Its temporary accounts and opaque cookies are created locally for this run.
      CIRNET_E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Select exact dependency artifacts from the system lock
        run: python scripts/select_ci_release.py --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Bootstrap the pinned independent DEV allocator
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-verification
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python scripts/install_contracts.py --dev-only
      - name: Allocate an external verification artifact session
        env:
          CIRNET_ARTIFACTS_DIR: ${{ runner.temp }}/cirnet-artifacts/${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          CIRNET_ARTIFACTS_CONTEXT="$(node --input-type=module -e "import {getArtifactContext} from './scripts/artifact-paths.mjs'; console.log(JSON.stringify(getArtifactContext()))")"
          export CIRNET_ARTIFACTS_CONTEXT
          echo "CIRNET_ARTIFACTS_CONTEXT=$CIRNET_ARTIFACTS_CONTEXT" >> "$GITHUB_ENV"
          artifact_session="$(node scripts/artifact-paths.mjs)"
          echo "CIRNET_ARTIFACTS_SESSION=$artifact_session" >> "$GITHUB_ENV"
      - name: Install all real local services and pinned contract tools
        env:
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: |
          python -m pip install -r requirements-verification.txt
          python scripts/install_contracts.py
          python scripts/install_simulator.py
          python scripts/install_hardware.py
          python - <<'PY'
          import subprocess
          import sys
          from scripts.artifact_download import download_artifact
          from scripts.artifact_paths import artifact_directory
          from scripts.install_release import API_INSTALL_PROBE, verify_api_wheel
          from scripts.system_release_manifest import load_manifest
          selected = load_manifest('integration/release-set.json')['repositories']['Remote']['artifacts']['python']
          wheel = artifact_directory('selected-api') / selected['filename']
          wheel.write_bytes(download_artifact(selected['url'], selected['sha256']))
          verify_api_wheel(wheel, selected['sha256'])
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel)], check=True)
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)], check=True)
          subprocess.run([sys.executable, '-I', '-c', API_INSTALL_PROBE, str(wheel), selected['sha256']], check=True)
          PY
          python -m pip check
          python -m scripts.check_simulator_consumer
          python -m scripts.check_hardware_consumer
      - name: Record native runner resources
        run: |
          python -c "import json,os,platform,psutil; print(json.dumps({'platform':platform.platform(),'python':platform.python_version(),'cpuCount':os.cpu_count(),'cpuAffinity':psutil.Process().cpu_affinity(),'memoryBytes':psutil.virtual_memory().total},sort_keys=True))"
      - name: Download the explicit reviewed Interface product
        if: github.ref_type == 'tag' || inputs.interface_source == 'published'
        env:
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: python -m scripts.install_interface --manifest integration/release-set.json --github-env "$GITHUB_ENV"
      - name: Export the exact Interface candidate commit
        if: github.ref_type != 'tag' && inputs.interface_source != 'published'
        run: python -m scripts.select_browser_interface --lock integration/browser-interface-source.json --github-env "$GITHUB_ENV"
      - name: Bootstrap Interface artifacts before its clean install
        if: github.ref_type == 'tag' || inputs.interface_source == 'published'
        env:
          CIRNET_CONTRACTS_ARTIFACT_MANIFEST: ''
          NETCIRCUIT_CONTRACTS_ARTIFACT_MANIFEST: ''
          CIRNET_ARTIFACTS_TOKEN: ${{ secrets.CIRNET_ARTIFACTS_READ_TOKEN || secrets.NETCIRCUIT_ARTIFACTS_READ_TOKEN }}
        run: node "$CIRNET_INTERFACE_ROOT/scripts/bootstrap-contracts.mjs" --github-env "$GITHUB_ENV"
      - name: Bootstrap public SDK inputs for the Interface candidate
        if: github.ref_type != 'tag' && inputs.interface_source != 'published'
        env:
          CIRNET_CONTRACTS_ARTIFACT_MANIFEST: ''
          NETCIRCUIT_CONTRACTS_ARTIFACT_MANIFEST: ''
        run: node "$CIRNET_INTERFACE_ROOT/scripts/bootstrap-contracts.mjs" --github-env "$GITHUB_ENV"
      - name: Install locked Playwright 1.64.1 and Interface dependencies
        working-directory: ${{ env.CIRNET_INTERFACE_ROOT }}
        run: npm ci --no-audit --no-fund
      - name: Check pinned artifact projections and route parity
        run: |
          python -m scripts.check_contract_consumer
          python scripts/generate_contracts.py --check
          python scripts/export_openapi.py --check
          python scripts/sync_editor_catalog.py --check
      - name: AST dependency boundaries
        working-directory: ${{ env.CIRNET_INTERFACE_ROOT }}
        run: npm run check:boundaries
      - name: Typecheck and build production entrypoints
        working-directory: ${{ env.CIRNET_INTERFACE_ROOT }}
        run: |
          npx tsc --noEmit -p tsconfig.e2e.json
          npm run build
      - name: Install the pinned Chromium revision and platform dependencies
        working-directory: ${{ env.CIRNET_INTERFACE_ROOT }}
        run: npm run test:e2e:install -- --with-deps
      - name: Real API, SQLite, Hardware Service and Chromium suite
        shell: bash
        run: |
          set -o pipefail
          artifact_session="$(node scripts/artifact-paths.mjs)"
          python scripts/check_release.py --group browser 2>&1 | tee "$artifact_session/e2e.log"
      - name: Browser failure evidence and JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CIRNET_ARTIFACTS_SESSION }}/playwright
            ${{ env.CIRNET_ARTIFACTS_SESSION }}/playwright-reporters
            ${{ env.CIRNET_ARTIFACTS_SESSION }}/e2e.log
          if-no-files-found: warn
          retention-days: 7
          # Generated evidence is created outside the checkout and retained by CI.
          include-hidden-files: true
      - name: Clean the owned external artifact session after upload
        if: always()
        shell: bash
        run: node scripts/cleanup-artifact-session.mjs --cleanup "$CIRNET_ARTIFACTS_SESSION"
