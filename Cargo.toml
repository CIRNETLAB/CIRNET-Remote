[package]
name = "cirnet-remote-native"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE"
description = "CIRNET native Remote API and control orchestration"
repository = "https://github.com/cirnetlab/cirnet-remote"
build = "native/build.rs"

[lib]
path = "native/src/lib.rs"

[[bin]]
name = "cirnet-remote"
path = "native/src/main.rs"

[dependencies]
cirnet-contracts-native = { git = "https://github.com/cirnetlab/cirnet-contracts.git", rev = "e640f80b1199779659d3db7817fee16d13cc24c1", version = "=0.1.2" }
argon2 = "=0.5.3"
axum = { version = "=0.8.9", features = ["ws", "http1", "json", "tokio"] }
base64 = "=0.22.1"
futures-util = { version = "=0.3.31", features = ["sink"] }
http = "=1.3.1"
hyper-util = { version = "=0.1.17", features = ["tokio"] }
prost = "=0.14.1"
rand = "=0.8.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "preserve_order"] }
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "sqlite", "json", "chrono", "derive"] }
subtle = "=2.6.1"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "fs", "process", "io-util"] }
tokio-stream = { version = "=0.1.17", features = ["net"] }
tonic = { version = "=0.14.2", default-features = false, features = ["codegen", "transport", "router"] }
tonic-prost = "=0.14.2"
tungstenite = { version = "=0.29.0", default-features = false }
tower = { version = "=0.5.2", features = ["util"] }
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4", "v5"] }

[build-dependencies]
cirnet-contracts-native = { git = "https://github.com/cirnetlab/cirnet-contracts.git", rev = "e640f80b1199779659d3db7817fee16d13cc24c1", version = "=0.1.2" }
prost = "=0.14.1"
prost-types = "=0.14.1"
tonic-prost-build = "=0.14.2"

[[test]]
name = "db_readonly"
path = "native/tests/db_readonly.rs"

[[test]]
name = "db_write"
path = "native/tests/db_write.rs"

[[test]]
name = "auth_lifecycle"
path = "native/tests/auth_lifecycle.rs"

[[test]]
name = "db_migrations"
path = "native/tests/db_migrations.rs"

[[test]]
name = "project_records"
path = "native/tests/project_records.rs"

[dev-dependencies]
tokio-tungstenite = "=0.29.0"

[[test]]
name = "cli"
path = "native/tests/cli.rs"

[[test]]
name = "assignment_records"
path = "native/tests/assignment_records.rs"

[[test]]
name = "compiler_cases"
path = "native/tests/compiler_cases.rs"

[[test]]
name = "auth_http_host"
path = "native/tests/auth_http_host.rs"

[[test]]
name = "runtime_records"
path = "native/tests/runtime_records.rs"

[[test]]
name = "runtime_operations"
path = "native/tests/runtime_operations.rs"

[[test]]
name = "project_numeric"
path = "native/tests/project_numeric.rs"

[[test]]
name = "runtime_captures"
path = "native/tests/runtime_captures.rs"

[[test]]
name = "scheduler_authority"
path = "native/tests/scheduler_authority.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[[test]]
name = "stop_claim_authority"
path = "native/tests/stop_claim_authority.rs"

[[test]]
name = "db_timing"
path = "native/tests/db_timing.rs"
