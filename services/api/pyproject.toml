[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netcircuit-api"
version = "0.1.0"
description = "Application backend for net*CIRCUIT Remote"
requires-python = ">=3.11"
dependencies = [
  "netcircuit-contracts==1.0.1",
  "netcircuit-simulator==0.2.0",
  "grpcio==1.84.0",
  "protobuf==7.36.2",
  "psycopg[binary]==3.3.6",
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "sqlalchemy==2.1.4",
  "argon2-cffi==25.1.0",
  "alembic==1.20.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
